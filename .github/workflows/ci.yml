name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build • test • coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore
        run: dotnet restore Oficina.slnx

      - name: Build
        run: dotnet build Oficina.slnx -c Release --no-restore

      - name: Test (+ coverage)
        run: dotnet test Oficina.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  docker:
    name: docker build (imagem)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (fiap-app)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fiap-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Para deploy real: logar num registry (GHCR/ECR) e push no merge.
      - name: Nota deploy
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: echo "::notice::Imagem construida. Deploy no cluster e feito por fiap-infra-k8s (Docker Desktop local)."
