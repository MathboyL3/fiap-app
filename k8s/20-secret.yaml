# ATENÇÃO: valores de exemplo apenas para ambiente LOCAL/DEV.
# Em produção, gere segredos fortes e gerencie fora do Git (Sealed Secrets, SOPS, Vault, etc.).
# stringData aceita texto puro (o Kubernetes faz o base64 automaticamente).
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secrets
  namespace: oficina
  labels:
    app.kubernetes.io/part-of: oficina
type: Opaque
stringData:
  # Segredo do JWT (>= 32 chars).
  Jwt__Secret: "CHANGE_ME_use_at_least_32_characters_secret_2026"
  # Segredo do webhook de aprovação de orçamento.
  Webhook__Secret: "CHANGE_ME_webhook_secret_dev_only"
  # Senha do Postgres (usada tanto pelo banco quanto pela API).
  Postgres__Password: "oficina_dev_only"
